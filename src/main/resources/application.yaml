spring:
  application:
    name: notification-ms

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${NO_REPLY_BREVO_USERNAME}
    password: ${NO_REPLY_BREVO_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: az.shopery.notification_ms.event.NotificationEvent

application:
  frontend:
    base-url: ${FRONTEND_BASE_URL}

app:
  mail:
    from: ${NO_REPLY_SHOPERY_USERNAME}

topic:
  notification: notification-topic
